{% extends "page_utilisateur.html" %}
{% load static %}
{% load widget_tweaks %}
{% block ajouter %}
<div class="titreadd">
    <h2>Ajouter un livre </h2>
</div>
<div class="formulaire">
    <form method="POST" enctype="multipart/form-data">
        {%  csrf_token %}
        <div class="couverture">
    <label for="id_couverture" class="cover-upload">
        <img src="{% static 'images/plus.png' %}" id="cover-preview">
    </label>
    {{ form.couverture }}
</div>
        <div class="grandgroupe">
             <div class="group">
              <label for="{{form.titre.id_for_label}}"> Titre</label>
              {{form.titre}}
             </div>
            <div class="group">
             <label for="{{form.description.id_for_label}}">Description</label>
             {{form.description}}
            </div>
            <div class="group">
                <button class="boutton" type="submit"> Creer une nouvelle histoire</button>
            </div>
        </div>
    </form>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const input = document.getElementById("id_couverture");
    const preview = document.getElementById("cover-preview");

    if (!input || !preview) return;

    input.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            preview.src = URL.createObjectURL(file);
        }
    });
});
</script>
{% endblock %}
