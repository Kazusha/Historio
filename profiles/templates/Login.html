{% load  static %}
{% load widget_tweaks %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Connection</title>
        <link rel="stylesheet" href="{% static 'css/connexion.css' %}">
        <link rel="icon" type="images/png" size="32x32" href="{% static 'images/historio.png' %}">
        <link rel="icon" type="images/png" sizes="16x16" href="{% static 'images/historio.png'%}">
    </head>
    <body>
        <div class ="connexion">
            <div class ="image">
                <img src="{% static 'images/livre.png' %}" class="image" alt="image">
                 </div>
            <div class = " card_container">
             <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                    <div class="form-group">
                    <a class="titre"> Connecter vous a votre compte Historio</a>
                    </div>
                
                 <div class="form-group">
                       <a>Email</a>
                       {{form.username | add_class:"input-field"}}
                 </div>
                 <div class="form-group">
                    <a> Mot de Passe</a>
                    {{form.password| add_class:"input-field"}}
                 </div>
                 <button type="submit" class="submit">Se Connecter</button>
             </form>
            
        </div>
        </div>
        
    </body>
</html>
